name: Refresh prices

on:
  schedule:
    # Every 15 minutes, weekdays, 13:00-21:59 UTC (US market hours).
    # GitHub can start scheduled runs a few minutes late.
    - cron: "*/15 13-21 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: refresh-prices
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch the latest prices
        run: python scripts/update_prices.py

      - name: Save the new prices to the repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/prices.json
          if git diff --cached --quiet; then
            echo "No price changes to save."
          else
            git commit -m "Update prices"
            git pull --rebase
            git push
          fi

      - name: Ask GitHub Pages to rebuild
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Rebuild request skipped; Pages will pick up the commit on its own."
